<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable | Coco Nail's</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<style>
@font-face{font-family:"Coco Serif";src:url("/fonts/lora-italic.woff") format("woff");font-style:italic;font-weight:400 700;font-display:swap}
:root{--poudre:#fbe6e8;--bordeaux:#5e0f1c;--vernis:#c8102e;--encre:#24161a;--gris:#6d585c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--poudre);color:var(--encre);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
main{max-width:460px;width:100%;background:#fff;border-radius:26px;padding:34px 24px;box-shadow:0 10px 30px -18px rgba(94,15,28,.45)}
img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 5px var(--poudre)}
h1{font-family:"Coco Serif",Georgia,serif;font-style:italic;font-weight:600;color:var(--bordeaux);font-size:2.2rem;margin:14px 0 6px}
p{color:var(--gris);line-height:1.5;margin:0 0 22px}
a.btn{display:block;padding:15px;border-radius:999px;font-weight:700;text-decoration:none;margin-top:10px;border:2px solid var(--bordeaux)}
.plein{background:var(--bordeaux);color:#fff}.trait{color:var(--bordeaux)}
a:focus-visible{outline:3px solid var(--vernis);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/images/logo-coco-nails.webp" width="96" height="96" alt="Coco Nail's">
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou plus. Retrouvez la carte beauté et les disponibilités de Coralie sur la page d'accueil.</p>
  <a class="btn plein" href="/#reserver">Réserver un créneau</a>
  <a class="btn trait" href="/">Retour à l'accueil</a>
</main>
</body>
</html>
